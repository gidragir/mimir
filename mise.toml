[tools]
java = "temurin-27" # если в реестре mise нет — заменить на "openjdk-27"
node = "lts"
actionlint = "1.7.12"

[tasks.build]
description = "Собрать всё и прогнать тесты"
run = "./gradlew build"
run_windows = "gradlew.bat build"

[tasks.test]
description = "Прогнать все тесты"
run = "./gradlew allTests"
run_windows = "gradlew.bat allTests"

[tasks."test:fast"]
description = "Быстрый прогон всех JVM-тестов и build-logic (без Wasm/JS/Android)"
run = "./gradlew ciJvmTests"
run_windows = "gradlew.bat ciJvmTests"

[tasks."ci:fast"]
description = "Быстрая локальная предпроверка перед push (токены + actionlint + ciJvmTests)"
run = "node scripts/generate-tokens.mjs --check && actionlint && ./gradlew ciJvmTests"
run_windows = "node scripts/generate-tokens.mjs --check && gradlew.bat ciJvmTests"

[tasks.desktop]
description = "Запустить десктопное приложение"
run = "./gradlew :apps:desktop:run"
run_windows = "gradlew.bat :apps:desktop:run"

[tasks.android]
description = "Установить Android-приложение на устройство"
run = "./gradlew :apps:android:installDebug"
run_windows = "gradlew.bat :apps:android:installDebug"

[tasks.daemon]
description = "Запустить демон"
run = "./gradlew :apps:daemon:run"
run_windows = "gradlew.bat :apps:daemon:run"

[tasks.web]
description = "Запустить web UI в режиме разработки"
run = "./gradlew :apps:web-ui:wasmJsBrowserDevelopmentRun"
run_windows = "gradlew.bat :apps:web-ui:wasmJsBrowserDevelopmentRun"

[tasks.plugin]
description = "Собрать плагин Obsidian"
run = "./gradlew :apps:obsidian-plugin:assemblePlugin"
run_windows = "gradlew.bat :apps:obsidian-plugin:assemblePlugin"

[tasks.extension]
description = "Собрать расширение браузера"
run = "./gradlew :apps:browser-extension:assembleExtension"
run_windows = "gradlew.bat :apps:browser-extension:assembleExtension"

[tasks."build:extension"]
description = "Собрать расширение браузера (алиас)"
run = "./gradlew :apps:browser-extension:assembleExtension"
run_windows = "gradlew.bat :apps:browser-extension:assembleExtension"

[tasks.screenshots]
description = "Сгенерировать скриншоты UI desktop и расширения браузера"
run = "./gradlew :libs:ui:desktopTest --rerun --tests 'dev.mimir.ui.screenshots.*' && ./gradlew :apps:browser-extension:assembleExtension && node apps/browser-extension/scripts/capture-screenshots.mjs"
run_windows = "gradlew.bat :libs:ui:desktopTest --rerun --tests dev.mimir.ui.screenshots.* && gradlew.bat :apps:browser-extension:assembleExtension && node apps/browser-extension/scripts/capture-screenshots.mjs"

[tasks."package:extension"]
description = "Упаковать расширение в zip для релиза"
run = "./gradlew :apps:browser-extension:zipExtension"
run_windows = "gradlew.bat :apps:browser-extension:zipExtension"

[tasks."package:msi"]
description = "Собрать MSI (только Windows)"
run = "./gradlew :apps:desktop:packageMsi"
run_windows = "gradlew.bat :apps:desktop:packageMsi"

[tasks."package:arch"]
description = "Собрать uber-jar для пакета Arch"
run = "./gradlew :apps:desktop:packageUberJarForCurrentOS"
run_windows = "gradlew.bat :apps:desktop:packageUberJarForCurrentOS"

[tasks."package:docker"]
description = "Собрать Docker-образ демона"
run = "docker build -f packaging/docker/Dockerfile -t mimir:dev ."
run_windows = "docker build -f packaging/docker/Dockerfile -t mimir:dev ."
