[tools]
jq = "1.8.2" # win:* (scripts/win-vm) разбирают JSON guest-agent
java = "temurin-27" # если в реестре mise нет — заменить на "openjdk-27"
node = "lts"
jactionlint = "2.5.0" # поддерживаемый форк rhysd/actionlint (бывший actionlint объявлен в mise устаревшим)
shellcheck = "0.11.0" # jactionlint вызывает его для run:-скриптов; без него локальная проверка слабее CI

[tasks.build]
description = "Собрать всё и прогнать тесты"
run = "./gradlew build"
run_windows = "gradlew.bat build"

[tasks.test]
description = "Прогнать все тесты"
run = "./gradlew allTests"
run_windows = "gradlew.bat allTests"

[tasks."test:fast"]
description = "Быстрый прогон всех JVM-тестов и build-logic (без Wasm/JS/Android)"
run = "./gradlew ciJvmTests"
run_windows = "gradlew.bat ciJvmTests"

[tasks."tokens:generate"]
description = "Сгенерировать артефакты дизайн-токенов из design/tokens.json"
run = "node design/generate-tokens.mjs"

[tasks."tokens:check"]
description = "Проверить, что артефакты дизайн-токенов не разошлись с design/tokens.json"
run = "node design/generate-tokens.mjs --check"

[tasks."skills:sync"]
description = "Перенести проектные скиллы в .agents/skills и пересоздать симлинки в .claude/skills"
run = "node .agents/sync-skills.mjs --fix"

[tasks."skills:check"]
description = "Проверить, что .claude/skills — только симлинки на .agents/skills (единый источник скиллов)"
run = "node .agents/sync-skills.mjs"

[tasks."ci:fast"]
description = "Быстрая локальная предпроверка перед push (токены + скиллы + win-vm тесты + jactionlint + ciJvmTests)"
depends = ["tokens:check", "skills:check", "win:test"]
# --profile correctness — паритет с проверками actionlint; профиль default добавляет правила безопасности и политик.
run = "jactionlint --profile correctness && ./gradlew ciJvmTests"
run_windows = "gradlew.bat ciJvmTests"

[tasks.desktop]
description = "Запустить десктопное приложение"
run = "./gradlew :apps:desktop:run"
run_windows = "gradlew.bat :apps:desktop:run"

[tasks.android]
description = "Установить Android-приложение на устройство"
run = "./gradlew :apps:android:installDebug"
run_windows = "gradlew.bat :apps:android:installDebug"

[tasks.daemon]
description = "Запустить демон"
run = "./gradlew :apps:daemon:run"
run_windows = "gradlew.bat :apps:daemon:run"

[tasks.web]
description = "Запустить web UI в режиме разработки"
run = "./gradlew :apps:web-ui:wasmJsBrowserDevelopmentRun"
run_windows = "gradlew.bat :apps:web-ui:wasmJsBrowserDevelopmentRun"

[tasks.plugin]
description = "Собрать плагин Obsidian"
run = "./gradlew :apps:obsidian-plugin:assemblePlugin"
run_windows = "gradlew.bat :apps:obsidian-plugin:assemblePlugin"

[tasks."obsidian:deploy-dir"]
description = "Собрать плагин Obsidian и скопировать в $MIMIR_OBSIDIAN_DEPLOY_DIR (по умолчанию build/obsidian-deploy)/<pluginId>"
run = """
./gradlew :apps:obsidian-plugin:assemblePlugin
id=$(sed -n 's/^mimir.obsidianPluginId=//p' gradle.properties)
dest="${MIMIR_OBSIDIAN_DEPLOY_DIR:-build/obsidian-deploy}/$id"
rm -rf "$dest" && mkdir -p "$dest" && cp -r apps/obsidian-plugin/build/plugin/* "$dest/"
echo "$(realpath "$dest")"
"""
run_windows = """
gradlew.bat :apps:obsidian-plugin:assemblePlugin
powershell -NoProfile -Command "$id=(Select-String -Path gradle.properties -Pattern '^mimir.obsidianPluginId=(.*)$').Matches[0].Groups[1].Value; $d=if($env:MIMIR_OBSIDIAN_DEPLOY_DIR){$env:MIMIR_OBSIDIAN_DEPLOY_DIR}else{'build/obsidian-deploy'}; $d=Join-Path $d $id; if(Test-Path $d){Remove-Item -Recurse -Force $d}; New-Item -ItemType Directory -Force $d | Out-Null; Copy-Item apps/obsidian-plugin/build/plugin/* $d -Recurse; Write-Output (Resolve-Path $d)"
"""

[tasks.extension]
description = "Собрать расширение браузера"
run = "./gradlew :apps:browser-extension:assembleExtension"
run_windows = "gradlew.bat :apps:browser-extension:assembleExtension"

[tasks."build:extension"]
description = "Собрать расширение браузера (алиас)"
run = "./gradlew :apps:browser-extension:assembleExtension"
run_windows = "gradlew.bat :apps:browser-extension:assembleExtension"

[tasks.screenshots]
description = "Сгенерировать скриншоты UI desktop и расширения браузера"
run = "./gradlew :libs:ui:desktopTest -Pmimir.screenshots=true --rerun --tests '*ScreenshotTest' && ./gradlew :apps:browser-extension:assembleExtension && node apps/browser-extension/scripts/capture-screenshots.mjs"
run_windows = "gradlew.bat :libs:ui:desktopTest -Pmimir.screenshots=true --rerun --tests *ScreenshotTest && gradlew.bat :apps:browser-extension:assembleExtension && node apps/browser-extension/scripts/capture-screenshots.mjs"

[tasks."package:extension"]
description = "Упаковать расширение в zip для релиза"
run = "./gradlew :apps:browser-extension:zipExtension"
run_windows = "gradlew.bat :apps:browser-extension:zipExtension"

[tasks."package:msi"]
description = "Собрать MSI (только Windows)"
run = "./gradlew :apps:desktop:packageMsi"
run_windows = "gradlew.bat :apps:desktop:packageMsi"

[tasks."package:arch"]
description = "Собрать uber-jar для пакета Arch"
run = "./gradlew :apps:desktop:packageUberJarForCurrentOS"
run_windows = "gradlew.bat :apps:desktop:packageUberJarForCurrentOS"

[tasks."package:docker"]
description = "Собрать Docker-образ демона"
run = "docker build -f packaging/docker/Dockerfile -t mimir:dev ."
run_windows = "docker build -f packaging/docker/Dockerfile -t mimir:dev ."

[tasks."win:test"]
description = "Тесты хостового CLI Windows-VM (scripts/win-vm) на фейковом virsh"
run = "bash scripts/win-vm/tests/run.sh"
run_windows = "cmd /c echo win:test - пропущено, только Linux"

[tasks."win:provision"]
description = "Подготовить Windows-VM: mise, JDK, задача MimirDev (--with-secrets копирует mise.local.toml)"
run = "bash scripts/win-vm/winvm.sh provision"
run_windows = "cmd /c echo win:provision - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:sync"]
description = "Синхронизировать рабочее дерево в Windows-VM"
run = "bash scripts/win-vm/winvm.sh sync"
run_windows = "cmd /c echo win:sync - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:run"]
description = "Собрать и запустить desktop в сессии пользователя Windows-VM"
run = "bash scripts/win-vm/winvm.sh run"
run_windows = "cmd /c echo win:run - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:msi"]
description = "Собрать и установить MSI в Windows-VM (--upgrade — без удаления старой версии)"
run = "bash scripts/win-vm/winvm.sh msi"
run_windows = "cmd /c echo win:msi - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:uninstall"]
description = "Удалить MSI в Windows-VM и показать отчёт об остатках"
run = "bash scripts/win-vm/winvm.sh uninstall"
run_windows = "cmd /c echo win:uninstall - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:logs"]
description = "Хвост лога Windows-VM: build | run | msi"
run = "bash scripts/win-vm/winvm.sh logs"
run_windows = "cmd /c echo win:logs - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:snapshot"]
description = "Создать снапшот provisioned у Windows-VM"
run = "bash scripts/win-vm/winvm.sh snapshot"
run_windows = "cmd /c echo win:snapshot - только на Linux-хосте с libvirt & exit /b 1"

[tasks."win:reset"]
description = "Откатить Windows-VM к снапшоту provisioned (--yes)"
run = "bash scripts/win-vm/winvm.sh reset"
run_windows = "cmd /c echo win:reset - только на Linux-хосте с libvirt & exit /b 1"
