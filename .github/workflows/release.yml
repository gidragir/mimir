name: Release

# Запускается из release-please.yml (workflow_call) или вручную (workflow_dispatch).
# Триггера на push тега нет: при токене RELEASE_PLEASE_TOKEN тег от Release Please запустил бы релиз второй раз.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (v<версия>)"
        required: true
        type: string
      dry_run:
        description: "Проверка: собрать всё из выбранной ветки, ничего не публикуя"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Тег релиза (v<версия>)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}-${{ inputs.dry_run == true }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  # В dry-run собирается код выбранной ветки, иначе строго код тега.
  SOURCE_REF: ${{ inputs.dry_run == true && github.sha || inputs.tag }}
  # actions/checkout вызывает git init: без этого в лог каждого задания попадает hint про имя ветки.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Параллельная сборка файловых артефактов на нужных платформах.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msi
            os: windows-latest
            task: :apps:desktop:packageMsi
            paths: apps/desktop/build/compose/binaries/main/msi/*.msi
          - name: linux-bundles
            os: ubuntu-latest
            task: :apps:android:assembleRelease :apps:obsidian-plugin:zipPlugin :apps:browser-extension:zipExtension
            paths: |
              apps/android/build/outputs/apk/release/*.apk
              apps/obsidian-plugin/build/distributions/*.zip
              apps/obsidian-plugin/build/plugin/main.js
              apps/obsidian-plugin/build/plugin/manifest.json
              apps/browser-extension/build/distributions/*.zip
            android: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment (Developer Mode, symlinks, long paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v "LongPathsEnabled" /t REG_DWORD /d 1 /f
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Tag matches mimir.version
        if: ${{ inputs.dry_run != true }}
        run: |
          version=$(sed -n 's/^mimir.version=//p' gradle.properties)
          test "v$version" = "$TAG" || { echo "Tag $TAG != mimir.version $version"; exit 1; }
      - uses: jdx/mise-action@v5
      - name: Configure Java environment from mise
        run: |
          java_home=$(mise where java | tr '\\' '/')
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      # Android SDK и лицензии уже есть в образе ubuntu-latest (ANDROID_HOME), платформу и build-tools скачает AGP.
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode Android keystore
        if: matrix.android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Без секрета APK собирается неподписанным (см. шаг ниже).
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || exit 0
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mimir.keystore"
          {
            echo "MIMIR_KEYSTORE_PATH=$RUNNER_TEMP/mimir.keystore"
            echo "MIMIR_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MIMIR_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MIMIR_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build
        env:
          MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_ID }}
          MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_SECRET }}
          MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_ID: ${{ secrets.MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_ID }}
          MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_SECRET }}
        run: ./gradlew ${{ matrix.task }}
      - name: Mark unsigned APK
        if: matrix.android
        run: |
          [ -z "$MIMIR_KEYSTORE_PATH" ] || exit 0
          for f in apps/android/build/outputs/apk/release/*.apk; do
            case "$f" in *-unsigned.apk) ;; *) mv "$f" "${f%.apk}-unsigned.apk" ;; esac
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.paths }}
          retention-days: 1
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm jdk-openjdk base-devel git
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Build package
        # build-arch.sh: packageUberJarForCurrentOS -> копирует jar -> makepkg под непривилегированным пользователем
        env:
          MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_ID }}
          MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MIMIR_BUILD_GOOGLE_DESKTOP_CLIENT_SECRET }}
          MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_ID: ${{ secrets.MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_ID }}
          MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.MIMIR_BUILD_GOOGLE_DEVICE_CLIENT_SECRET }}
        run: .github/scripts/build-arch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          retention-days: 1
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - id: img
        run: |
          name=$(sed -n 's/^mimir.dockerImage=//p' gradle.properties)
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "ref=ghcr.io/$owner/$name" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ inputs.dry_run != true }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: ${{ inputs.dry_run != true }}
          tags: |
            ${{ steps.img.outputs.ref }}:${{ env.TAG }}
            ${{ steps.img.outputs.ref }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [build, arch, docker]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundles
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: arch
          path: dist
      - name: Flatten artifacts and generate checksums
        run: |
          cd dist
          shopt -s globstar nullglob
          for f in **/*; do
            if [ -f "$f" ] && [ "$(dirname "$f")" != "." ]; then
              mv "$f" .
            fi
          done
          for d in */; do
            [ -d "$d" ] && rm -rf "$d"
          done
          sha256sum * > sha256sums.txt
      - name: Generate release summary
        run: |
          echo "### 📦 Release Assets (${{ env.TAG }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          while read -r hash file; do
            echo "| \`$file\` | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done < dist/sha256sums.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
