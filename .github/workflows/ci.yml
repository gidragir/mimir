name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.context-init/**'
      - '.github/.release-please-manifest.json'
      - '.github/release-please-config.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.context-init/**'
      - '.github/.release-please-manifest.json'
      - '.github/release-please-config.json'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_macos:
        description: "Запустить сборку также на macOS"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# actions/checkout вызывает git init: без этого в лог каждого задания попадает hint про имя ветки.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core_or_libs: ${{ steps.filter.outputs.core_or_libs }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      js_or_web: ${{ steps.filter.outputs.js_or_web }}
      is_release_pr: ${{ steps.matrix.outputs.is_release_pr }}
      package_msi: ${{ steps.matrix.outputs.package_msi }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Только node и actionlint из mise.toml: JDK этой джобе не нужен.
      - uses: jdx/mise-action@v5
        with:
          install_args: node actionlint
      - name: Verify design tokens are in sync
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run tokens:check
      - name: Lint GitHub Actions workflows
        run: actionlint -color
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core_or_libs:
              - 'libs/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'mise.toml'
              - 'gradlew'
              - 'gradlew.bat'
              - 'packaging/arch/build-arch.sh'
              - '.github/workflows/**'
            msi_packaging:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/windows/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'mise.toml'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/windows/**'
              - 'packaging/arch/**'
              - 'packaging/docker/**'
            android:
              - 'apps/android/**'
            js_or_web:
              - 'apps/web-ui/**'
              - 'apps/obsidian-plugin/**'
              - 'apps/browser-extension/**'
              - 'design/**'
              - 'scripts/**'
      - id: matrix
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MACOS: ${{ inputs.run_macos }}
          CORE_OR_LIBS: ${{ steps.filter.outputs.core_or_libs }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
          MSI_PACKAGING: ${{ steps.filter.outputs.msi_packaging }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
            echo "package_msi=false" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_MACOS" = "true" ]; }; then
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo "package_msi=true" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo "package_msi=true" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            # Коммит слияния релизного PR: MSI собирает release.yml, дублировать сборку в CI не нужно.
            if [[ "$COMMIT_SUBJECT" == "chore(main): release "* ]]; then
              echo "package_msi=false" >> "$GITHUB_OUTPUT"
            elif [ "$EVENT_NAME" = "push" ] || [ "$MSI_PACKAGING" = "true" ]; then
              echo "package_msi=true" >> "$GITHUB_OUTPUT"
            else
              echo "package_msi=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$CORE_OR_LIBS" = "true" ] || [ "$DESKTOP" = "true" ]; then
              echo 'os_matrix=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            else
              echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: build (${{ matrix.os }})
    needs: detect-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect-changes.outputs.os_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment (Developer Mode, symlinks, long paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v "LongPathsEnabled" /t REG_DWORD /d 1 /f
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Configure Java environment from mise
        run: |
          java_home=$(mise where java | tr '\\' '/')
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      # Android SDK и лицензии уже есть в образе ubuntu-latest (ANDROID_HOME), платформу и build-tools скачает AGP.
      - uses: gradle/actions/setup-gradle@v6
      # Разделение обязанностей по ОС и затронутым подсистемам без секретов:
      # - Release Please PR: быстрая валидация версии в gradle.properties и build-logic
      # - Windows: только десктопные тесты и упаковка MSI (без дублирования KMP/JS Karma-тестов)
      # - macOS (workflow_dispatch): десктопные тесты и сборка дистрибутива
      # - Linux (только Android): юнит-тесты и сборка Android APK
      # - Linux (только JS/Web/Design): плагин Obsidian, расширение браузера, Wasm Web-UI и UI-тесты
      # - Linux (ядро/десктоп/всё остальное): полный прогон mise run build
      - name: Fast JVM tests (ciJvmTests)
        if: ${{ needs.detect-changes.outputs.is_release_pr != 'true' && (github.event_name == 'schedule' || needs.detect-changes.outputs.core_or_libs == 'true' || needs.detect-changes.outputs.desktop == 'true' || (needs.detect-changes.outputs.android != 'true' && needs.detect-changes.outputs.js_or_web != 'true') || runner.os != 'Linux') }}
        run: ./gradlew ciJvmTests
      - name: Full build and packaging
        env:
          IS_RELEASE_PR: ${{ needs.detect-changes.outputs.is_release_pr }}
          PACKAGE_MSI: ${{ needs.detect-changes.outputs.package_msi }}
          CORE_OR_LIBS: ${{ (needs.detect-changes.outputs.core_or_libs == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          DESKTOP: ${{ (needs.detect-changes.outputs.desktop == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          ANDROID: ${{ needs.detect-changes.outputs.android }}
          JS_OR_WEB: ${{ needs.detect-changes.outputs.js_or_web }}
        run: |
          if [ "$IS_RELEASE_PR" = "true" ]; then
            env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -p build-logic test && env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :apps:desktop:help
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ "$PACKAGE_MSI" = "true" ]; then
              ./gradlew :apps:desktop:packageMsi -Pmimir.bundleWebUi=true
            else
              echo "Skipping MSI packaging: no packaging-related changes in this PR"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./gradlew :apps:desktop:packageUberJarForCurrentOS -Pmimir.bundleWebUi=true
          elif [ "$CORE_OR_LIBS" != "true" ] && [ "$DESKTOP" != "true" ] && [ "$JS_OR_WEB" != "true" ] && [ "$ANDROID" = "true" ]; then
            ./gradlew -p build-logic test && ./gradlew :apps:android:testDebugUnitTest :apps:android:assembleDebug
          elif [ "$CORE_OR_LIBS" != "true" ] && [ "$DESKTOP" != "true" ] && [ "$ANDROID" != "true" ] && [ "$JS_OR_WEB" = "true" ]; then
            env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -p build-logic test && env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :apps:obsidian-plugin:checkPlugin :apps:browser-extension:checkExtension :apps:web-ui:wasmJsBrowserDistribution :libs:ui:desktopTest
          else
            ./gradlew build --continue
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore

  arch-dry-run:
    name: arch (dry-run)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm jdk-openjdk base-devel git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
          key: arch-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: arch-gradle-
      - name: Build Arch package
        run: packaging/arch/build-arch.sh

  docker-dry-run:
    name: docker (dry-run)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: false
