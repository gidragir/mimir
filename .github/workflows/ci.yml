name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.context-init/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.context-init/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core_or_libs: ${{ steps.filter.outputs.core_or_libs }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      js_or_web: ${{ steps.filter.outputs.js_or_web }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core_or_libs:
              - 'libs/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/windows/**'
              - 'packaging/arch/**'
              - 'packaging/docker/**'
            android:
              - 'apps/android/**'
            js_or_web:
              - 'apps/web-ui/**'
              - 'apps/obsidian-plugin/**'
              - 'apps/browser-extension/**'
              - 'design/**'
              - 'scripts/**'
      - id: matrix
        run: |
          if [ "${{ steps.filter.outputs.core_or_libs }}" = "true" ] || [ "${{ steps.filter.outputs.desktop }}" = "true" ]; then
            echo 'os_matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.os }})
    needs: detect-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect-changes.outputs.os_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment (Developer Mode, symlinks, long paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v "LongPathsEnabled" /t REG_DWORD /d 1 /f
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - name: Configure Java environment from mise
        run: |
          java_home=$(mise where java | tr '\\' '/')
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      # Android SDK ставим только на Linux; на остальных ОС Android-таргеты пропускаются с предупреждением.
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
        # По умолчанию ставится устаревший `tools`, которого нет в новых cmdline-tools; платформу и build-tools скачает AGP.
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # Без секретов: сборка и тесты обязаны проходить без них.
      - run: mise run build
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore

  tokens:
    name: design tokens sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Verify design tokens are in sync
        run: node scripts/generate-tokens.mjs --check
