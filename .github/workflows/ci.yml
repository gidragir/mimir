name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.context-init/**'
      - '.github/.release-please-manifest.json'
      - '.github/release-please-config.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.context-init/**'
      - '.github/.release-please-manifest.json'
      - '.github/release-please-config.json'
  workflow_dispatch:
    inputs:
      run_macos:
        description: "Запустить сборку также на macOS"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# actions/checkout вызывает git init: без этого в лог каждого задания попадает hint про имя ветки.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core_or_libs: ${{ steps.filter.outputs.core_or_libs }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      js_or_web: ${{ steps.filter.outputs.js_or_web }}
      is_release_pr: ${{ steps.matrix.outputs.is_release_pr }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify design tokens are in sync
        run: node scripts/generate-tokens.mjs --check
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core_or_libs:
              - 'libs/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/windows/**'
              - 'packaging/arch/**'
              - 'packaging/docker/**'
            android:
              - 'apps/android/**'
            js_or_web:
              - 'apps/web-ui/**'
              - 'apps/obsidian-plugin/**'
              - 'apps/browser-extension/**'
              - 'design/**'
              - 'scripts/**'
      - id: matrix
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MACOS: ${{ inputs.run_macos }}
          CORE_OR_LIBS: ${{ steps.filter.outputs.core_or_libs }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
        run: |
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_MACOS" = "true" ]; then
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$CORE_OR_LIBS" = "true" ] || [ "$DESKTOP" = "true" ]; then
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.os }})
    needs: detect-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect-changes.outputs.os_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment (Developer Mode, symlinks, long paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v "LongPathsEnabled" /t REG_DWORD /d 1 /f
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Configure Java environment from mise
        run: |
          java_home=$(mise where java | tr '\\' '/')
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      # Android SDK и лицензии уже есть в образе ubuntu-latest (ANDROID_HOME), платформу и build-tools скачает AGP.
      - uses: gradle/actions/setup-gradle@v6
      # Разделение обязанностей по ОС и затронутым подсистемам без секретов:
      # - Release Please PR: быстрая валидация версии в gradle.properties и build-logic
      # - Windows: только десктопные тесты и упаковка MSI (без дублирования KMP/JS Karma-тестов)
      # - macOS (workflow_dispatch): десктопные тесты и сборка дистрибутива
      # - Linux (только Android): юнит-тесты и сборка Android APK
      # - Linux (только JS/Web/Design): плагин Obsidian, расширение браузера, Wasm Web-UI и UI-тесты
      # - Linux (ядро/десктоп/всё остальное): полный прогон mise run build
      - name: Build and verify
        env:
          IS_RELEASE_PR: ${{ needs.detect-changes.outputs.is_release_pr }}
          CORE_OR_LIBS: ${{ needs.detect-changes.outputs.core_or_libs }}
          DESKTOP: ${{ needs.detect-changes.outputs.desktop }}
          ANDROID: ${{ needs.detect-changes.outputs.android }}
          JS_OR_WEB: ${{ needs.detect-changes.outputs.js_or_web }}
        run: |
          if [ "$IS_RELEASE_PR" = "true" ]; then
            ./gradlew -p build-logic test && ./gradlew :apps:desktop:help
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew :apps:desktop:test :apps:desktop:packageMsi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./gradlew :apps:desktop:test :apps:desktop:packageUberJarForCurrentOS
          elif [ "$CORE_OR_LIBS" != "true" ] && [ "$DESKTOP" != "true" ] && [ "$JS_OR_WEB" != "true" ] && [ "$ANDROID" = "true" ]; then
            ./gradlew :apps:android:testDebugUnitTest :apps:android:assembleDebug
          elif [ "$CORE_OR_LIBS" != "true" ] && [ "$DESKTOP" != "true" ] && [ "$ANDROID" != "true" ] && [ "$JS_OR_WEB" = "true" ]; then
            ./gradlew :apps:obsidian-plugin:checkPlugin :apps:browser-extension:checkExtension :apps:web-ui:wasmJsBrowserDistribution :libs:ui:desktopTest
          else
            mise run build
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore
