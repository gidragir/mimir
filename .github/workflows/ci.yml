name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.context-init/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.context-init/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows environment (Developer Mode, symlinks, long paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v "LongPathsEnabled" /t REG_DWORD /d 1 /f
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - name: Configure Java environment from mise
        run: |
          java_home=$(mise where java | tr '\\' '/')
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
      # Android SDK ставим только на Linux; на остальных ОС Android-таргеты пропускаются с предупреждением.
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
        # По умолчанию ставится устаревший `tools`, которого нет в новых cmdline-tools; платформу и build-tools скачает AGP.
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # Без секретов: сборка и тесты обязаны проходить без них.
      - run: mise run build
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore

  changesets:
    name: versions and changesets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0 # не в package.json: поле packageManager ломает yarn, которым Kotlin/JS ставит npm-зависимости
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Пока нет pnpm-lock.yaml; после его коммита убрать --no-frozen-lockfile и добавить cache: pnpm в setup-node.
      - run: pnpm install --no-frozen-lockfile
      - name: Versions of packages and gradle.properties are in sync
        run: pnpm run version:check
      - name: Changeset status (pull requests)
        if: github.event_name == 'pull_request'
        # Информативно: правки без релизного смысла (docs, ci) changeset не требуют.
        continue-on-error: true
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
