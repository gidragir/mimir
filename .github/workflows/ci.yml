name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.context-init/**'
      - '.github/.release-please-manifest.json'
      - '.github/release-please-config.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.context-init/**'
      - '.github/.release-please-manifest.json'
      - '.github/release-please-config.json'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_macos:
        description: "Запустить сборку также на macOS"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# actions/checkout вызывает git init: без этого в лог каждого задания попадает hint про имя ветки.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  detect-changes:
    name: Detect Changed Modules
    if: "!startsWith(github.event.head_commit.message, 'chore(main): release ')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core_or_libs: ${{ steps.filter.outputs.core_or_libs }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      js_or_web: ${{ steps.filter.outputs.js_or_web }}
      is_release_pr: ${{ steps.matrix.outputs.is_release_pr }}
      package_msi: ${{ steps.matrix.outputs.package_msi }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Только node, jactionlint и shellcheck из mise.toml: JDK этой джобе не нужен.
      - uses: jdx/mise-action@v5
        with:
          install_args: node jactionlint shellcheck jq
      - name: Verify design tokens are in sync
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run tokens:check
      - name: Verify agent skills are in sync
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run skills:check
      - name: Verify Windows VM host CLI tests
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run win:test
      - name: Lint GitHub Actions workflows
        run: jactionlint --profile correctness
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core_or_libs:
              - 'libs/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'mise.toml'
              - 'gradlew'
              - 'gradlew.bat'
              - 'packaging/arch/build-arch.sh'
              - '.github/workflows/**'
            msi_packaging:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/windows/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'mise.toml'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/windows/**'
              - 'packaging/arch/**'
              - 'packaging/docker/**'
            android:
              - 'apps/android/**'
            scripts_or_skills:
              - 'scripts/**'
              - '.agents/**'
              - '.claude/**'
            js_or_web:
              - 'apps/web-ui/**'
              - 'apps/obsidian-plugin/**'
              - 'apps/browser-extension/**'
              - 'design/**'
              - 'gradle/yarn/**'
      - id: matrix
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MACOS: ${{ inputs.run_macos }}
          CORE_OR_LIBS: ${{ steps.filter.outputs.core_or_libs }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
          ANDROID: ${{ steps.filter.outputs.android }}
          JS_OR_WEB: ${{ steps.filter.outputs.js_or_web }}
          SCRIPTS_OR_SKILLS: ${{ steps.filter.outputs.scripts_or_skills }}
          MSI_PACKAGING: ${{ steps.filter.outputs.msi_packaging }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          {
            if [[ "$HEAD_REF" == release-please--* ]]; then
              echo "is_release_pr=true"
              echo "package_msi=false"
              echo 'os_matrix=["ubuntu-latest","windows-latest"]'
            elif [ "$EVENT_NAME" = "schedule" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_MACOS" = "true" ]; }; then
              echo "is_release_pr=false"
              echo "package_msi=true"
              echo 'os_matrix=["ubuntu-latest","windows-latest","macos-latest"]'
            elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "is_release_pr=false"
              echo "package_msi=true"
              echo 'os_matrix=["ubuntu-latest","windows-latest"]'
            else
              echo "is_release_pr=false"
              # Коммит слияния релизного PR: MSI собирает release.yml, дублировать сборку в CI не нужно.
              if [[ "$COMMIT_SUBJECT" == "chore(main): release "* ]]; then
                echo "package_msi=false"
              elif [ "$EVENT_NAME" = "push" ] || [ "$MSI_PACKAGING" = "true" ]; then
                echo "package_msi=true"
              else
                echo "package_msi=false"
              fi
              if [ "$CORE_OR_LIBS" = "true" ] || [ "$DESKTOP" = "true" ]; then
                echo 'os_matrix=["ubuntu-latest","windows-latest"]'
              elif [ "$ANDROID" != "true" ] && [ "$JS_OR_WEB" != "true" ] && [ "$SCRIPTS_OR_SKILLS" = "true" ]; then
                # Только scripts/.agents/.claude: их проверяют шаги detect-changes (win:test, skills:check), сборка не нужна.
                echo 'os_matrix=[]'
              else
                echo 'os_matrix=["ubuntu-latest"]'
              fi
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.os_matrix != '[]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect-changes.outputs.os_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      # git-настройки нужны уже при checkout (symlinks/длинные пути); остальное делает setup-mimir.
      - name: Configure git for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mimir
      # Разделение обязанностей по ОС и затронутым подсистемам без секретов:
      # - Release Please PR: быстрая валидация версии в gradle.properties и build-logic
      # - Windows: только десктопные тесты и упаковка MSI (без дублирования KMP/JS Karma-тестов)
      # - macOS (workflow_dispatch): десктопные тесты и сборка дистрибутива
      # - Linux (только Android): юнит-тесты и сборка Android APK
      # - Linux (только JS/Web/Design): плагин Obsidian, расширение браузера, Wasm Web-UI и UI-тесты
      # - Linux (ядро/десктоп/всё остальное): полный прогон mise run build
      # На Linux JVM-тесты входят в `build --continue`/целевые задачи ниже, отдельный ciJvmTests дублировал бы их.
      - name: Fast JVM tests (ciJvmTests)
        if: ${{ needs.detect-changes.outputs.is_release_pr != 'true' && runner.os != 'Linux' }}
        run: ./gradlew ciJvmTests
      - name: Full build and packaging
        env:
          IS_RELEASE_PR: ${{ needs.detect-changes.outputs.is_release_pr }}
          PACKAGE_MSI: ${{ needs.detect-changes.outputs.package_msi }}
          CORE_OR_LIBS: ${{ (needs.detect-changes.outputs.core_or_libs == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          DESKTOP: ${{ (needs.detect-changes.outputs.desktop == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          ANDROID: ${{ needs.detect-changes.outputs.android }}
          JS_OR_WEB: ${{ needs.detect-changes.outputs.js_or_web }}
        run: |
          if [ "$IS_RELEASE_PR" = "true" ]; then
            env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :build-logic:test :apps:desktop:help
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ "$PACKAGE_MSI" = "true" ]; then
              ./gradlew :apps:desktop:packageMsi -Pmimir.bundleWebUi=true
            else
              echo "Skipping MSI packaging: no packaging-related changes in this PR"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./gradlew :apps:desktop:packageUberJarForCurrentOS -Pmimir.bundleWebUi=true
          elif [ "$CORE_OR_LIBS" != "true" ] && [ "$DESKTOP" != "true" ] && [ "$JS_OR_WEB" != "true" ] && [ "$ANDROID" = "true" ]; then
            ./gradlew :build-logic:test :apps:android:testDebugUnitTest :apps:android:assembleDebug
          elif [ "$CORE_OR_LIBS" != "true" ] && [ "$DESKTOP" != "true" ] && [ "$ANDROID" != "true" ] && [ "$JS_OR_WEB" = "true" ]; then
            env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :build-logic:test :apps:obsidian-plugin:checkPlugin :apps:browser-extension:checkExtension :apps:web-ui:wasmJsBrowserDistribution :libs:ui:desktopTest
          else
            ./gradlew build --continue
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore

  arch-dry-run:
    name: arch (dry-run)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm jdk-openjdk base-devel git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ключ считается до сборки: post-шаг actions/cache иначе пересчитывает hashFiles по workspace,
      # где makepkg оставил файлы, недоступные раннеру, и падает (Fail to hash files).
      - name: Compute Gradle cache key
        id: gradle-key
        run: echo "hash=${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
          key: arch-gradle-${{ steps.gradle-key.outputs.hash }}
          restore-keys: arch-gradle-
      - name: Build Arch package
        run: packaging/arch/build-arch.sh

  docker-dry-run:
    name: docker (dry-run)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: false
